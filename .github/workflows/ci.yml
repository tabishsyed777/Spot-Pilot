name: SpotPilot checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: spotpilot demo
      - run: spotpilot benchmark --episodes 3 --output runs/ci-benchmark.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.worker -t spotpilot-worker .
      - run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=32m --cap-drop ALL --security-opt no-new-privileges --memory 128m --cpus 1 --pids-limit 64 spotpilot-worker
